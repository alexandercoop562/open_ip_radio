[workspace]
resolver = "2"
members = ["station", "client"]

[profile.release]
debug = true
opt-level = "s"

[workspace.dependencies]
anyhow = "1.0"
futures-util = "0.3"
num-traits = "0.2"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.0", features = ["chrono"] }
dhat = "0.3.3"
rodio = "0.21"

tokio = { version = "1.40", features = ["full"] }
tokio-tungstenite = "0.28"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
